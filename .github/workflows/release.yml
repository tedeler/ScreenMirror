name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCREENMIRROR_GIT_ID: ${{ github.sha }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release
      - name: Package tarball
        run: |
          staging="screenmirror-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$staging"
          cp target/release/screenmirror "$staging/"
          tar -czf "${staging}.tar.gz" "$staging"
          echo "TARBALL=${staging}.tar.gz" >> "$GITHUB_ENV"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper
      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -d
          cp ../*.deb .
          echo "DEB=$(echo *.deb)" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$TARBALL" "$DEB"
          --title "$GITHUB_REF_NAME"
          --generate-notes
