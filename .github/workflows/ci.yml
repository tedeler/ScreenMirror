name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCREENMIRROR_GIT_ID: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build and test
    # ubuntu-latest was still Ubuntu 24.04 during the Oct–Nov 2026 migration.
    # A 24.04 build links Qt 6.x from that release and emits t64 dependency
    # names Kubuntu 26.04 does not ship. Pin the guest's release.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the Qt dialog toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config qt6-base-dev
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release

  debian-package:
    name: Debian package
    # Same pin as the test job: shlibs must be generated on Ubuntu 26.04.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper g++ pkg-config qt6-base-dev
      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -d
          mkdir -p dist
          cp ../*.deb dist/
          ls -la dist/
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: screenmirror-deb
          path: dist/*.deb
